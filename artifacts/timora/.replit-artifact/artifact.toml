kind = "web"
previewPath = "/"
title = "Timora"
description = "A calm, AI-assisted student productivity app for organizing courses, assignments, schedules, study plans, focus sessions, and academic progress."
version = "1.0.0"
id = "artifacts/timora"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20611

[services.development]
run = "pnpm --filter @workspace/timora run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/timora", "run", "build" ]
serve = "static"
publicDir = "artifacts/timora/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20611"
BASE_PATH = "/"
